apiVersion: v1
kind: Namespace
metadata:
  name: orderflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-api
  namespace: orderflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing-api
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pricing-api
          image: orderflow/pricing-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: APP_VERSION
              value: "0.1.0"
            - name: SERVER_PORT
              value: "8081"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-api
  namespace: orderflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pricing-api
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
