name: App CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [orders-api, pricing-api]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/${{ matrix.service }}/pom.xml
      - name: Verify Java service
        working-directory: apps/${{ matrix.service }}
        run: ./mvnw -B -ntp verify

  container:
    name: Docker build (${{ matrix.service }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [orders-api, pricing-api]
    steps:
      - uses: actions/checkout@v7
      - name: Build image without publishing
        run: docker build --file "apps/${{ matrix.service }}/Dockerfile" --tag "orderflow/${{ matrix.service }}:ci" "apps/${{ matrix.service }}"
