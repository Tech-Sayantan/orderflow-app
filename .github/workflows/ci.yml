name: App CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [orders-api, pricing-api]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/${{ matrix.service }}/pom.xml
      - name: Verify Java service
        working-directory: apps/${{ matrix.service }}
        run: ./mvnw -B -ntp verify

  container:
    name: Docker build (${{ matrix.service }})
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [orders-api, pricing-api]
    steps:
      - uses: actions/checkout@v7
      - name: Build image without publishing
        run: docker build --file "apps/${{ matrix.service }}/Dockerfile" --tag "orderflow/${{ matrix.service }}:ci" "apps/${{ matrix.service }}"

  publish:
    name: Publish image to ECR (${{ matrix.service }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [orders-api, pricing-api]
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: orderflow/${{ matrix.service }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISHER_ROLE_ARN }}
          role-session-name: orderflow-ecr-${{ matrix.service }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and publish immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_uri="${registry}/${ECR_REPOSITORY}"

          # A rerun for the same commit reuses its immutable image tag.
          digest="$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"

          if [[ "$digest" != sha256:* ]]; then
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$registry"

            docker build \
              --platform linux/amd64 \
              --file "apps/${{ matrix.service }}/Dockerfile" \
              --tag "${image_uri}:${IMAGE_TAG}" \
              "apps/${{ matrix.service }}"
            docker push "${image_uri}:${IMAGE_TAG}"

            digest="$(aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
          fi

          echo "uri=${image_uri}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${ECR_REPOSITORY}"
            echo "- Tag: \`${image_uri}:${IMAGE_TAG}\`"
            echo "- Digest: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
